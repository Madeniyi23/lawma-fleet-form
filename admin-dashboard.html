<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LAWMA Fleet Revalidation — Management Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
    <style>
        :root {
            --green: #165f24;
            --green-light: #1e7a30;
            --green-dark: #0f4a1b;
            --red: #b7320e;
            --red-light: #d4461a;
            --text-dark: #2C3E50;
            --text-light: #5D6D7B;
            --bg: #f4f6f5;
            --white: #fff;
            --border: #D5DBDD;
            --yellow: #F39C12;
        }
        * { margin:0; padding:0; box-sizing:border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: var(--bg); color: var(--text-dark); }

        /* Header */
        .header {
            background: var(--white);
            border-bottom: 3px solid var(--green);
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 1rem;
        }
        .header-left { display: flex; align-items: center; gap: 1rem; }
        .header-left img { height: 36px; }
        .header-left h1 { font-size: 1.3rem; color: var(--green); }
        .header-left h1 span { font-weight: 400; color: var(--text-light); font-size: 0.85rem; display: block; }
        .header-right { display: flex; align-items: center; gap: 1rem; font-size: 0.85rem; color: var(--text-light); }
        .status-dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
        .status-dot.live { background: var(--green-light); animation: pulse 2s infinite; }
        .status-dot.error { background: var(--red); }
        @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.4} }
        .btn-refresh {
            background: var(--green); color: white; border: none; padding: 0.5rem 1rem;
            border-radius: 6px; cursor: pointer; font-size: 0.85rem; display: flex; align-items: center; gap: 0.4rem;
        }
        .btn-refresh:hover { background: var(--green-dark); }

        /* KPI Cards */
        .kpi-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1rem;
            padding: 1.5rem 2rem;
            max-width: 1400px;
            margin: 0 auto;
        }
        .kpi-card {
            background: var(--white);
            border-radius: 10px;
            padding: 1.25rem;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
            border-left: 4px solid var(--green);
        }
        .kpi-card.accent { border-left-color: var(--red); }
        .kpi-card.warn { border-left-color: var(--yellow); }
        .kpi-label { font-size: 0.8rem; color: var(--text-light); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 0.5rem; }
        .kpi-value { font-size: 2rem; font-weight: 700; color: var(--text-dark); line-height: 1.1; }
        .kpi-sub { font-size: 0.8rem; color: var(--text-light); margin-top: 0.35rem; }
        .kpi-bar { height: 6px; background: #e8eceb; border-radius: 3px; margin-top: 0.75rem; overflow: hidden; }
        .kpi-bar-fill { height: 100%; border-radius: 3px; transition: width 0.8s ease; }
        .kpi-bar-fill.green { background: var(--green-light); }
        .kpi-bar-fill.red { background: var(--red); }

        /* Filters */
        .filters {
            padding: 0 2rem;
            max-width: 1400px;
            margin: 0 auto 1rem;
            display: flex;
            gap: 0.75rem;
            flex-wrap: wrap;
            align-items: center;
        }
        .filters label { font-size: 0.85rem; font-weight: 600; color: var(--text-light); }
        .filters select, .filters input {
            padding: 0.4rem 0.75rem;
            border: 1px solid var(--border);
            border-radius: 6px;
            font-size: 0.85rem;
            background: white;
        }
        .filters input[type="text"] { width: 220px; }

        /* Table */
        .table-wrapper {
            padding: 0 2rem 2rem;
            max-width: 1400px;
            margin: 0 auto;
        }
        .table-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 0.75rem;
        }
        .table-header h2 { font-size: 1.1rem; color: var(--green); }
        .table-header .count { font-size: 0.85rem; color: var(--text-light); }
        .table-container {
            background: var(--white);
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
            overflow-x: auto;
        }
        table { width: 100%; border-collapse: collapse; font-size: 0.85rem; }
        thead th {
            background: #f8faf9;
            padding: 0.75rem 1rem;
            text-align: left;
            font-weight: 600;
            color: var(--text-light);
            border-bottom: 2px solid var(--border);
            white-space: nowrap;
            cursor: pointer;
            user-select: none;
        }
        thead th:hover { color: var(--green); }
        thead th .sort-arrow { font-size: 0.7rem; margin-left: 0.3rem; }
        tbody tr { border-bottom: 1px solid #f0f2f1; transition: background 0.15s; }
        tbody tr:hover { background: #f8faf9; }
        tbody td { padding: 0.65rem 1rem; }
        .badge {
            display: inline-block;
            padding: 0.15rem 0.5rem;
            border-radius: 4px;
            font-size: 0.75rem;
            font-weight: 600;
        }
        .badge-green { background: #e6f4ea; color: var(--green); }
        .badge-red { background: #fce8e6; color: var(--red); }
        .badge-yellow { background: #fef7e0; color: #b8860b; }
        .badge-gray { background: #f0f2f1; color: var(--text-light); }
        .wm-id { font-weight: 700; color: var(--green); letter-spacing: 0.5px; }
        .empty-state { text-align: center; padding: 3rem; color: var(--text-light); }

        /* Pagination */
        .pagination {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0.75rem 1rem;
            border-top: 1px solid var(--border);
            font-size: 0.85rem;
            color: var(--text-light);
        }
        .pagination button {
            padding: 0.35rem 0.75rem;
            border: 1px solid var(--border);
            background: white;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.8rem;
        }
        .pagination button:disabled { opacity: 0.4; cursor: default; }
        .pagination button:not(:disabled):hover { background: #f8faf9; }

        /* Loading */
        .loading { text-align: center; padding: 2rem; color: var(--text-light); }
        .spinner { display: inline-block; width: 24px; height: 24px; border: 3px solid var(--border); border-top-color: var(--green); border-radius: 50%; animation: spin 0.8s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* LGA breakdown */
        .lga-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 1rem;
            padding: 0 2rem 1.5rem;
            max-width: 1400px;
            margin: 0 auto;
        }
        .lga-card {
            background: var(--white);
            border-radius: 10px;
            padding: 1rem 1.25rem;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
        }
        .lga-card h3 { font-size: 0.9rem; color: var(--green); margin-bottom: 0.5rem; }
        .lga-row { display: flex; justify-content: space-between; padding: 0.25rem 0; font-size: 0.8rem; border-bottom: 1px solid #f0f2f1; }
        .lga-row:last-child { border: none; }

        .section-title {
            padding: 0 2rem;
            max-width: 1400px;
            margin: 0 auto 0.75rem;
            font-size: 1.1rem;
            color: var(--green);
        }

        @media (max-width: 768px) {
            .kpi-grid { grid-template-columns: repeat(2, 1fr); padding: 1rem; }
            .filters, .table-wrapper, .lga-grid { padding-left: 1rem; padding-right: 1rem; }
            .header { padding: 1rem; }
        }
        @media (max-width: 480px) {
            .kpi-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>

        <select id="filter-status" onchange="applyFilters()">
            <option value="">All Status</option>
            <option value="active">Active</option>
            <option value="grounded">Grounded</option>
        </select>
        <select id="filter-registered" onchange="applyFilters()">
            <option value="">Registered & Unregistered</option>
            <option value="true">Registered Only</option>
            <option value="false">Unregistered Only</option>
        </select>
        <input type="text" id="filter-search" placeholder="Search WM-ID, company, plate..." oninput="applyFilters()">
    </div>

    <!-- Truck Table -->
    <div class="table-wrapper" id="table-section" style="display:none;">
        <div class="table-header">
            <h2>Registered Trucks</h2>
            <span class="count" id="table-count"></span>
        </div>
        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th onclick="sortTable('registration_id')">WM-ID <span class="sort-arrow" id="sort-registration_id"></span></th>
                        <th onclick="sortTable('company_name')">PSP Operator <span class="sort-arrow" id="sort-company_name"></span></th>
                        <th onclick="sortTable('lga')">LGA <span class="sort-arrow" id="sort-lga"></span></th>
                        <th onclick="sortTable('vehicle_reg_number')">License Plate <span class="sort-arrow" id="sort-vehicle_reg_number"></span></th>
                        <th onclick="sortTable('make')">Make <span class="sort-arrow" id="sort-make"></span></th>
                        <th onclick="sortTable('vehicle_type')">Type <span class="sort-arrow" id="sort-vehicle_type"></span></th>
                        <th onclick="sortTable('operational_status')">Status <span class="sort-arrow" id="sort-operational_status"></span></th>
                        <th onclick="sortTable('is_registered')">Registered <span class="sort-arrow" id="sort-is_registered"></span></th>
                        <th onclick="sortTable('insurance_type')">Insurance <span class="sort-arrow" id="sort-insurance_type"></span></th>
                        <th onclick="sortTable('created_at')">Date <span class="sort-arrow" id="sort-created_at"></span></th>
                    </tr>
                </thead>
                <tbody id="truck-tbody"></tbody>
            </table>
            <div class="pagination" id="pagination">
                <span id="page-info"></span>
                <div>
                    <button onclick="changePage(-1)" id="btn-prev">Previous</button>
                    <button onclick="changePage(1)" id="btn-next">Next</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://iabunyskxepqfussvpwd.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_pVMZnYSkWFnrFWGbKeWBHg_0YiicplF';
        const TOTAL_WMIDS = 995;
        const TOTAL_PSPS = 433;

        let sb;
        let allTrucks = [];
        let allOperators = [];
        let filteredTrucks = [];
        let currentPage = 1;
        const PAGE_SIZE = 25;
        let sortCol = 'created_at';
        let sortDir = 'desc';

        async function loadDashboard() {
            try {
                if (!sb) {
                    sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
                }

                // Fetch operators
                const { data: ops, error: opsErr } = await sb.from('psp_operators').select('*');
                if (opsErr) throw opsErr;
                allOperators = ops || [];

                // Fetch trucks
                const { data: trucks, error: truckErr } = await sb.from('trucks').select('*, psp_operators(company_name, lga, ward, fleet_size)');
                if (truckErr) throw truckErr;
                allTrucks = (trucks || []).map(t => ({
                    ...t,
                    company_name: t.psp_operators ? t.psp_operators.company_name : '—',
                    lga: t.psp_operators ? t.psp_operators.lga : '—',
                    ward: t.psp_operators ? t.psp_operators.ward : '—'
                }));

                updateConnectionStatus(true);
                renderKPIs();
                renderLGABreakdown();
                populateFilters();
                applyFilters();

                document.getElementById('filters-bar').style.display = 'flex';
                document.getElementById('table-section').style.display = 'block';
                document.getElementById('lga-section-title').style.display = 'block';
                document.getElementById('last-updated').textContent = 'Updated: ' + new Date().toLocaleTimeString();

            } catch (err) {
                console.error('Dashboard load error:', err);
                updateConnectionStatus(false, err.message);
                document.getElementById('kpi-grid').innerHTML = `
                    <div class="kpi-card" style="grid-column: 1/-1;">
                        <div class="empty-state">
                            <strong>Could not connect to database</strong><br>
                            ${err.message || 'Connection error'}<br><br>
                            Make sure Supabase is active and try again.
                        </div>
                    </div>`;
            }
        }

        function updateConnectionStatus(ok, msg) {
            const el = document.getElementById('connection-status');
            if (ok) {
                el.innerHTML = '<span class="status-dot live"></span> Live';
            } else {
                el.innerHTML = '<span class="status-dot error"></span> ' + (msg || 'Disconnected');
            }
        }

        function renderKPIs() {
            const totalCaptured = allTrucks.length;
            const pctCaptured = TOTAL_WMIDS > 0 ? (totalCaptured / TOTAL_WMIDS * 100).toFixed(1) : 0;
            const pspsCaptured = new Set(allTrucks.map(t => t.operator_id)).size;
            const pctPsps = TOTAL_PSPS > 0 ? (pspsCaptured / TOTAL_PSPS * 100).toFixed(1) : 0;

            // Completion metrics
            const withPlate = allTrucks.filter(t => t.vehicle_reg_number).length;
            const withMake = allTrucks.filter(t => t.make).length;
            const withInsurance = allTrucks.filter(t => t.insurance_type && t.insurance_type !== 'None').length;
            const registered = allTrucks.filter(t => t.is_registered).length;
            const active = allTrucks.filter(t => t.operational_status && t.operational_status.toLowerCase().includes('active')).length;
            const grounded = allTrucks.filter(t => t.operational_status && t.operational_status.toLowerCase().includes('grounded')).length;

            // Info completeness: % of fields filled across all trucks
            const fields = ['vehicle_reg_number', 'make', 'vehicle_type', 'operational_status', 'insurance_type'];
            let filledCount = 0;
            let totalFields = allTrucks.length * fields.length;
            allTrucks.forEach(t => {
                fields.forEach(f => { if (t[f]) filledCount++; });
            });
            const completeness = totalFields > 0 ? (filledCount / totalFields * 100).toFixed(1) : 0;

            // Today's registrations
            const today = new Date().toISOString().split('T')[0];
            const todayCount = allTrucks.filter(t => t.created_at && t.created_at.startsWith(today)).length;

            // Unique LGAs
            const lgaSet = new Set(allTrucks.map(t => t.lga).filter(Boolean));

            document.getElementById('kpi-grid').innerHTML = `
                <div class="kpi-card">
                    <div class="kpi-label">Trucks Captured</div>
                    <div class="kpi-value">${totalCaptured} <span style="font-size:1rem;color:var(--text-light);">/ ${TOTAL_WMIDS}</span></div>
                    <div class="kpi-sub">${pctCaptured}% of total fleet</div>
                    <div class="kpi-bar"><div class="kpi-bar-fill green" style="width:${pctCaptured}%"></div></div>
                </div>
                <div class="kpi-card">
                    <div class="kpi-label">PSP Operators Registered</div>
                    <div class="kpi-value">${pspsCaptured} <span style="font-size:1rem;color:var(--text-light);">/ ${TOTAL_PSPS}</span></div>
                    <div class="kpi-sub">${pctPsps}% of operators</div>
                    <div class="kpi-bar"><div class="kpi-bar-fill green" style="width:${pctPsps}%"></div></div>
                </div>
                <div class="kpi-card accent">
                    <div class="kpi-label">Info Completeness</div>
                    <div class="kpi-value">${completeness}%</div>
                    <div class="kpi-sub">${filledCount} of ${totalFields} fields filled</div>
                    <div class="kpi-bar"><div class="kpi-bar-fill ${completeness >= 70 ? 'green' : 'red'}" style="width:${completeness}%"></div></div>
                </div>
                <div class="kpi-card">
                    <div class="kpi-label">Registered Vehicles</div>
                    <div class="kpi-value">${registered}</div>
                    <div class="kpi-sub">${totalCaptured > 0 ? (registered/totalCaptured*100).toFixed(0) : 0}% have license plates</div>
                </div>
                <div class="kpi-card">
                    <div class="kpi-label">Active Trucks</div>
                    <div class="kpi-value" style="color:var(--green);">${active}</div>
                    <div class="kpi-sub">${grounded > 0 ? grounded + ' grounded' : 'None grounded'}</div>
                </div>
                <div class="kpi-card warn">
                    <div class="kpi-label">Insured Trucks</div>
                    <div class="kpi-value">${withInsurance}</div>
                    <div class="kpi-sub">${totalCaptured > 0 ? (withInsurance/totalCaptured*100).toFixed(0) : 0}% insured</div>
                </div>
                <div class="kpi-card">
                    <div class="kpi-label">Today's Registrations</div>
                    <div class="kpi-value">${todayCount}</div>
                    <div class="kpi-sub">${new Date().toLocaleDateString('en-NG', {weekday:'long', month:'short', day:'numeric'})}</div>
                </div>
                <div class="kpi-card">
                    <div class="kpi-label">LGAs Covered</div>
                    <div class="kpi-value">${lgaSet.size}</div>
                    <div class="kpi-sub">out of 56 Lagos LGAs</div>
                </div>
            `;
        }

        function renderLGABreakdown() {
            const lgaMap = {};
            allTrucks.forEach(t => {
                const lga = t.lga || 'Unknown';
                if (!lgaMap[lga]) lgaMap[lga] = { total: 0, active: 0, grounded: 0, registered: 0 };
                lgaMap[lga].total++;
                if (t.operational_status && t.operational_status.toLowerCase().includes('active')) lgaMap[lga].active++;
                if (t.operational_status && t.operational_status.toLowerCase().includes('grounded')) lgaMap[lga].grounded++;
                if (t.is_registered) lgaMap[lga].registered++;
            });

            const sorted = Object.entries(lgaMap).sort((a, b) => b[1].total - a[1].total);
            const grid = document.getElementById('lga-grid');

            if (sorted.length === 0) {
                grid.innerHTML = '';
                return;
            }

            grid.innerHTML = sorted.map(([lga, d]) => `
                <div class="lga-card">
                    <h3>${lga}</h3>
                    <div class="lga-row"><span>Total trucks</span><strong>${d.total}</strong></div>
                    <div class="lga-row"><span>Active</span><span class="badge badge-green">${d.active}</span></div>
                    <div class="lga-row"><span>Grounded</span><span class="badge ${d.grounded > 0 ? 'badge-red' : 'badge-gray'}">${d.grounded}</span></div>
                    <div class="lga-row"><span>Registered</span><span>${d.registered}</span></div>
                </div>
            `).join('');
        }

        function populateFilters() {
            const lgaSelect = document.getElementById('filter-lga');
            const lgas = [...new Set(allTrucks.map(t => t.lga).filter(Boolean))].sort();
            lgaSelect.innerHTML = '<option value="">All LGAs</option>' + lgas.map(l => `<option value="${l}">${l}</option>`).join('');
        }

        function applyFilters() {
            const lga = document.getElementById('filter-lga').value;
            const status = document.getElementById('filter-status').value;
            const registered = document.getElementById('filter-registered').value;
            const search = document.getElementById('filter-search').value.toLowerCase().trim();

            filteredTrucks = allTrucks.filter(t => {
                if (lga && t.lga !== lga) return false;
                if (status === 'active' && !(t.operational_status && t.operational_status.toLowerCase().includes('active'))) return false;
                if (status === 'grounded' && !(t.operational_status && t.operational_status.toLowerCase().includes('grounded'))) return false;
                if (registered === 'true' && !t.is_registered) return false;
                if (registered === 'false' && t.is_registered) return false;
                if (search) {
                    const haystack = [t.registration_id, t.company_name, t.vehicle_reg_number, t.make, t.lga, t.chassis_number].filter(Boolean).join(' ').toLowerCase();
                    if (!haystack.includes(search)) return false;
                }
                return true;
            });

            doSort();
            currentPage = 1;
            renderTable();
        }

        function doSort() {
            filteredTrucks.sort((a, b) => {
                let va = a[sortCol] || '';
                let vb = b[sortCol] || '';
                if (typeof va === 'boolean') { va = va ? 1 : 0; vb = vb ? 1 : 0; }
                if (typeof va === 'string') { va = va.toLowerCase(); vb = vb.toLowerCase(); }
                if (va < vb) return sortDir === 'asc' ? -1 : 1;
                if (va > vb) return sortDir === 'asc' ? 1 : -1;
                return 0;
            });

            // Update sort arrows
            document.querySelectorAll('.sort-arrow').forEach(el => el.textContent = '');
            const arrow = document.getElementById('sort-' + sortCol);
            if (arrow) arrow.textContent = sortDir === 'asc' ? ' ▲' : ' ▼';
        }

        function sortTable(col) {
            if (sortCol === col) {
                sortDir = sortDir === 'asc' ? 'desc' : 'asc';
            } else {
                sortCol = col;
                sortDir = 'asc';
            }
            doSort();
            renderTable();
        }

        function renderTable() {
            const tbody = document.getElementById('truck-tbody');
            const start = (currentPage - 1) * PAGE_SIZE;
            const pageData = filteredTrucks.slice(start, start + PAGE_SIZE);
            const totalPages = Math.ceil(filteredTrucks.length / PAGE_SIZE) || 1;

            document.getElementById('table-count').textContent = `${filteredTrucks.length} truck${filteredTrucks.length !== 1 ? 's' : ''} found`;

            if (pageData.length === 0) {
                tbody.innerHTML = '<tr><td colspan="10" class="empty-state">No trucks found matching your filters.</td></tr>';
            } else {
                tbody.innerHTML = pageData.map(t => {
                    const statusBadge = t.operational_status
                        ? (t.operational_status.toLowerCase().includes('active')
                            ? '<span class="badge badge-green">Active</span>'
                            : '<span class="badge badge-red">Grounded</span>')
                        : '<span class="badge badge-gray">—</span>';
                    const regBadge = t.is_registered
                        ? '<span class="badge badge-green">Yes</span>'
                        : '<span class="badge badge-yellow">No</span>';
                    const insuranceBadge = t.insurance_type
                        ? (t.insurance_type === 'None'
                            ? '<span class="badge badge-red">None</span>'
                            : `<span class="badge badge-green">${t.insurance_type}</span>`)
                        : '<span class="badge badge-gray">—</span>';
                    const date = t.created_at ? new Date(t.created_at).toLocaleDateString('en-NG', {month:'short', day:'numeric', hour:'2-digit', minute:'2-digit'}) : '—';

                    return `<tr>
                        <td class="wm-id">${t.registration_id || '—'}</td>
                        <td>${t.company_name || '—'}</td>
                        <td>${t.lga || '—'}</td>
                        <td>${t.vehicle_reg_number || '<span style="color:#ccc">—</span>'}</td>
                        <td>${t.make || '—'}</td>
                        <td>${t.vehicle_type || '—'}</td>
                        <td>${statusBadge}</td>
                        <td>${regBadge}</td>
                        <td>${insuranceBadge}</td>
                        <td style="white-space:nowrap">${date}</td>
                    </tr>`;
                }).join('');
            }

            document.getElementById('page-info').textContent = `Page ${currentPage} of ${totalPages}`;
            document.getElementById('btn-prev').disabled = currentPage <= 1;
            document.getElementById('btn-next').disabled = currentPage >= totalPages;
        }

        function changePage(delta) {
            const totalPages = Math.ceil(filteredTrucks.length / PAGE_SIZE) || 1;
            currentPage = Math.max(1, Math.min(totalPages, currentPage + delta));
            renderTable();
        }

        // Auto-refresh every 30 seconds
        setInterval(loadDashboard, 30000);

        // Initial load
        loadDashboard();
    </script>
</body>
</html>
